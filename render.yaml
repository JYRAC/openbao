services:
  - type: web
    name: openbao
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: BAO_ADDR
        value: https://openbao.jyrac.stki.org
      - key: STORAGE_PG_CONNECTION_URL
        sync: false
      # ---- NetBird（段階 1）。戻すときは、NETBIRD_ENABLED を消して、再デプロイ ----
      - key: NETBIRD_ENABLED
        value: "1"
      - key: NB_HOSTNAME
        value: openbao
      # make-cert.sh の出力（証明書は公開情報、鍵は秘密）
      - key: NB_TLS_CERT_B64
        sync: false
      - key: NB_TLS_KEY_B64
        sync: false
      # 初回の登録のときだけ入れて、ピア設定を復元できたら、消す
      - key: NB_SETUP_KEY
        sync: false
      - key: NB_PRINT_CONFIG
        sync: false
      # 初回の登録のあと、ログの NB_CONFIG_B64=... の値を入れる
      - key: NB_CONFIG_B64
        sync: false
      # Casdoor の内部口 A（固定ピアの NetBird の IP:8443）。OIDC ログインの、サーバー側の通信が、ここを通る。
      # 空だと公開側につなぐ（C6 の前の、一時的な代替）。OIDC の設定（oidc_discovery_url など）は、変えない。
      - key: CASDOOR_NB_ADDR
        value: "100.125.23.8:8443"
      # 公開側は、/healthz だけに応答する(C7)。緊急で、公開側を一時的に全面再開するときだけ、値を "open" にして再デプロイする。
      # 使い終わったら、この行を消して(または値を空にして)再デプロイ。再デプロイで封印されるので、unseal が要る。
      # - key: OPENBAO_PUBLIC
      #   value: "open"
